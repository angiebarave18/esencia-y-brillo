name: Descargar fotos de productos

# Descarga las fotografías genéricas (sin marca, licencia Unsplash) a la carpeta img/
on:
  push:
    paths:
      - '.github/workflows/fotos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fotos
        run: |
          mkdir -p img
          while read -r archivo id; do
            [ -z "$archivo" ] && continue
            echo "Descargando $archivo"
            case "$id" in http*) url="$id";; *) url="https://images.unsplash.com/$id?auto=format&fit=crop&w=1400&q=80&fm=jpg";; esac
            curl -fsSL --retry 3 -o "img/$archivo" "$url"
          done <<'LISTA'
            perfume-ambar.jpg photo-1621275155732-2bff82c64fd2
            perfume-noir.jpg photo-1760920250029-36af9369a0bb
            locion-floral.jpg photo-1610113909607-2110f8401d92
            body-mist.jpg photo-1720967361123-9c17ec9025dc
            splash.jpg photo-1634944119598-837431c4900a
            collar-corazon.jpg photo-1761211115639-54394f139142
            argollas.jpg photo-1619203451989-53f6d2ca0e57
            pulsera.jpg photo-1602527418456-8b5cd2c7a4c2
            anillo.jpg photo-1611955167811-4711904bb9f8
            aretes.jpg photo-1704445010872-2faefdd733aa
            cadena.jpg photo-1611107683227-e9060eccd846
            reloj.jpg photo-1751437774882-deeea4352018
            bolso.jpg photo-1546333456-3e8ed81f41e2
            lentes-modelo.jpg photo-1590399830582-0bd885dee8e2
            caja-regalo.jpg photo-1764650909534-ebe7b1206466
            set-joyeria.jpg photo-1586878340506-af074f2ee999
            crema.jpg photo-1642683496509-121deffa9cf0
            maison.jpg photo-1620650893164-fb56b7e66067
            c-frasco-rojo.jpg photo-1720423738890-37689a6f6b95
            c-frasco-claro.jpg photo-1615634260167-c8cdede054de
            c-anillos-vitrina.jpg photo-1689070901068-a7cae2bbc36f
            c-anillos-bandeja.jpg photo-1586878341340-1971696a9b71
            c-frasco-negro.jpg photo-1584841247175-4d766cefa018
            c-spray.jpg https://images.pexels.com/photos/8167156/pexels-photo-8167156.jpeg?auto=compress&w=1400
          LISTA
          ls -la img
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "Agregar fotos de productos (Unsplash)"
          git push
